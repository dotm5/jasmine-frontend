name: Frontend CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Flutter and tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.3'
          channel: stable
      - name: Prepare generated version asset
        run: |
          mkdir -p .tmp
          echo "1.7.21-local" > lib/assets/version.txt
      - run: python -m unittest discover -s scripts/tests -v
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub --reporter expanded
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
