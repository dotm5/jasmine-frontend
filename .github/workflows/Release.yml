name: Android Release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/Build.yml
  build:
    if: github.repository == 'dotm5/jasmine-frontend' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/target
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
      JASMINE_TEST_BRIDGE_BINARY: ${{ github.workspace }}/native/target/debug/examples/bridge_stdio_fixture
      JASMINE_REQUIRE_API_COVERAGE: '1'
      JASMINE_API_AUDIT_REPORT: ${{ github.workspace }}/.tmp/api-runtime.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Read pinned backend commit
        id: backend
        run: |
          pin=$(git ls-tree HEAD native | awk '$1 == "160000" {print $3}')
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Missing native gitlink"; exit 1; }
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Checkout private backend (read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dotm5/jmbackend
          ref: ${{ steps.backend.outputs.sha }}
          path: native
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.3'
          channel: stable
      - name: Provision ephemeral runner tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-linux-android
          rustup default 1.97.1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p .tmp
          echo "1.7.21-local" > lib/assets/version.txt
      - name: Test and build pinned backend
        run: |
          if ! python native/scripts/ci_android.py --output "$PWD/.tmp/backend-bundle" > .tmp/backend-ci.log 2>&1; then
            echo "::error::Private backend checks/build failed. Reproduce this pin in the private backend CI; source-bearing compiler logs are not published."
            exit 1
          fi
          echo "Backend unit tests, SQLite smoke and Android build passed."
      - run: flutter pub get --enforce-lockfile
      - name: Typed Dart-Rust integration and API coverage
        run: |
          if ! flutter test tool_tests --no-pub --reporter expanded > .tmp/integration-ci.log 2>&1; then
            echo "::error::Dart-Rust integration failed; reproduce locally with the pinned backend."
            exit 1
          fi
          python scripts/check_api_contract_surface.py --runtime-report .tmp/api-runtime.json --out .tmp/api-coverage.json
          python scripts/check_backend_contract.py --bundle .tmp/backend-bundle
      - name: Build signed APK
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: androiddebugkey
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/jasmine-ci.jks
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64" || { echo "::error::Signing secret is missing"; exit 1; }
          trap 'rm -f "$ANDROID_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp .tmp/backend-bundle/jniLibs/arm64-v8a/librust.so android/app/src/main/jniLibs/arm64-v8a/
          flutter build apk --release --no-pub --no-tree-shake-icons --target-platform android-arm64
          python scripts/prepare_ci_release.py --bundle .tmp/backend-bundle --backend-sha "${{ steps.backend.outputs.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/build-manifest.json
            dist/release-notes.md
            dist/licenses.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: dist
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
            options=()
          else
            tag="ci-${COMMIT:0:12}"
            options=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release already exists; assets are immutable. Use a new commit/tag."
            exit 1
          fi
          gh release create "$tag" ./*.apk SHA256SUMS.txt build-manifest.json licenses.zip \
            --target "$COMMIT" --title "Jasmine $tag" --notes-file release-notes.md "${options[@]}"
